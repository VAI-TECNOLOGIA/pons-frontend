apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "br.com.grupopons.sistema"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.14206865"
    defaultConfig {
        applicationId "br.com.grupopons.sistema"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        ndk {
            debugSymbolLevel 'SYMBOL_TABLE'
        }
    }
    signingConfigs {
        release {
            if (keystoreProperties['keyAlias']) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // Capacitor carrega plugins por reflexao e usa @JavascriptInterface no bridge.
            // Com minify/shrink ligados e SEM keep rules, o R8 apaga o bridge/plugins
            // (crash "keeps stopping" na abertura) e remove o splash referenciado por
            // nome de string (Google flagra "recurso corrompido"). Padrao do Capacitor
            // e false — mantemos false pra nao quebrar o release.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties['keyAlias']) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// google-services.json é a "identidade" do app no Firebase (projeto pons-75376,
// app Android br.com.grupopons.sistema). Sem ele o build sai SEM Firebase e o push
// nunca funciona no Android. Antes o build só logava e seguia — saía release quebrado
// sem ninguém perceber. Agora: debug segue sem push (ok pra dev), mas RELEASE FALHA
// com mensagem clara, pra nunca mais publicar um AAB sem push.
def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists() && googleServicesFile.length() > 0) {
    apply plugin: 'com.google.gms.google-services'
} else {
    // Pega tasks de release e também as agregadas de empacotamento (bundle/bundleRelease
    // — o AAB da Play). Debug puro (assembleDebug/installDebug/run) segue sem push.
    def isRelease = gradle.startParameter.taskNames.any {
        def t = it.toLowerCase()
        t.contains('release') || t.contains('bundle')
    }
    if (isRelease) {
        throw new GradleException(
            "google-services.json AUSENTE em android/app/. O push NAO funciona no Android sem ele.\n" +
            "Baixe o arquivo do app 'br.com.grupopons.sistema' no Firebase (projeto pons-75376) e\n" +
            "coloque em android/app/google-services.json ANTES de gerar o AAB de release."
        )
    } else {
        logger.warn("google-services.json ausente — build de debug segue SEM push (ok pra dev/emulador).")
    }
}
