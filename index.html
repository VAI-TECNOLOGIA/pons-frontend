<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>VAI Sistema — Grupo Pons</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Watchdog anti-tela-branca: se o app não montar em 8s (index defasado em
      // cache de WebView apontando pra bundle antigo), recarrega UMA vez com
      // cache-bust. Sessão nova (reabrir o app) ganha nova tentativa.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0 && !sessionStorage.getItem('bootRetry')) {
          sessionStorage.setItem('bootRetry', '1');
          location.replace(location.pathname + '?r=' + Date.now());
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
