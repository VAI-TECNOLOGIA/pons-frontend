<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121214" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>VAI Sistema — Grupo Pons</title>
    <script>
      // Domínio único: o app só deve rodar em app.grupopons.com.br. Quem cair no
      // domínio de fábrica da Vercel (pons-frontend.vercel.app) é mandado pro
      // oficial ANTES do app carregar, preservando caminho/busca. Pedido Bello 30/09.
      (function () {
        if (location.hostname === 'pons-frontend.vercel.app') {
          location.replace('https://app.grupopons.com.br' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Watchdog anti-tela-branca: se o app não montar em 8s (index defasado em
      // cache de WebView apontando pra bundle antigo), recarrega UMA vez com
      // cache-bust. Sessão nova (reabrir o app) ganha nova tentativa.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0 && !sessionStorage.getItem('bootRetry')) {
          sessionStorage.setItem('bootRetry', '1');
          location.replace(location.pathname + '?r=' + Date.now());
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
